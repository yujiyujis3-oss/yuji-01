<!DOCTYPE html>
<html lang="ja">

</style>
</head>
<body>
<!-- 900x1950 ≒ スマホ画面比 (1080x2340) -->

      <circle cx="28" cy="317" r="17" fill="#1c1c1c"/><text x="28" y="324" text-anchor="middle" font-size="18" class="pop" style="fill:#fff">6</text>

      <circle cx="28" cy="317" r="17" fill="#1c1c1c"/><text x="28" y="324" text-anchor="middle" font-size="18" class="pop" style="fill:#fff">7</text>
    </svg>
    <rect width="860" height="345" fill="none" stroke="#1c1c1c" stroke-width="5"/>
  </g>

  <text x="450" y="1932" text-anchor="middle" font-size="22" opacity=".6">おわり</text>
</svg>
