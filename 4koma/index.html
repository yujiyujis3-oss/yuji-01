<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI仙人 4コマ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf8f1;
    --ink: #1c1c1c;
    --page: #e9e4d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "IPAGothic", "WenQuanYi Zen Hei", sans-serif;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  h1 {
    font-family: "Mochiy Pop One", "IPAGothic", sans-serif;
    font-size: 1.6rem;
    text-align: center;
    margin: 0 0 4px;
  }
  .sub { text-align: center; margin: 0 0 18px; font-size: .9rem; opacity: .7; }
  .panel {
    display: block;
    width: 100%;
    height: auto;
    background: var(--paper);
    border: 4px solid var(--ink);
    margin-bottom: 14px;
  }
  svg text { font-family: "Zen Maru Gothic", "IPAGothic", "WenQuanYi Zen Hei", sans-serif; font-weight: 700; }
  svg .pop { font-family: "Mochiy Pop One", "IPAGothic", sans-serif; font-weight: 400; }
  footer { text-align: center; font-size: .8rem; opacity: .6; }
</style>
</head>
<body>
<main>
  <h1>AI仙人の宿題</h1>
  <p class="sub">〜 転記がめんどくさい編 〜</p>

  <!-- 共通パーツ -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- AI仙人：グレーのパーカー＋ベネチアンマスク（原点＝顔の中心） -->
      <g id="sennin">
        <!-- 胴体（パーカー） -->
        <path d="M-105,230 C-105,150 -70,112 0,112 C70,112 105,150 105,230 Z" fill="#b8bbc0" stroke="#1c1c1c" stroke-width="4"/>
        <path d="M-40,160 L-40,230 M40,160 L40,230" stroke="#8e9197" stroke-width="3"/>
        <rect x="-38" y="175" width="76" height="40" rx="8" fill="#a9acb2" stroke="#1c1c1c" stroke-width="3"/>
        <!-- フード -->
        <path d="M-78,40 C-82,-50 -40,-88 0,-88 C40,-88 82,-50 78,40 C74,95 40,122 0,122 C-40,122 -74,95 -78,40 Z" fill="#c9ccd1" stroke="#1c1c1c" stroke-width="4"/>
        <!-- 顔 -->
        <ellipse cx="0" cy="18" rx="50" ry="60" fill="#f2d3b8" stroke="#1c1c1c" stroke-width="3"/>
        <!-- 前髪 -->
        <path d="M-50,8 C-54,-40 -24,-52 0,-52 C26,-52 54,-40 50,8 C40,-8 30,-14 22,-4 C18,-16 6,-20 -2,-8 C-10,-20 -24,-16 -28,-2 C-36,-12 -44,-6 -50,8 Z" fill="#232323"/>
        <!-- フードの縁 -->
        <path d="M-60,70 C-66,-40 -30,-66 0,-66 C30,-66 66,-40 60,70" fill="none" stroke="#9ea1a7" stroke-width="5"/>
        <!-- マスク -->
        <path d="M-58,10 C-50,-6 -30,-8 -14,2 C-6,6 6,6 14,2 C30,-8 50,-6 58,10 C54,36 36,44 20,38 C10,34 6,30 0,30 C-6,30 -10,34 -20,38 C-36,44 -54,36 -58,10 Z" fill="#6fcac2" stroke="#b88a1e" stroke-width="4"/>
        <path d="M-50,12 C-40,4 -26,6 -18,14 M50,12 C40,4 26,6 18,14" fill="none" stroke="#e0b949" stroke-width="3"/>
        <circle cx="-56" cy="8" r="4" fill="#e0b949"/>
        <circle cx="56" cy="8" r="4" fill="#e0b949"/>
        <!-- 紐 -->
        <path d="M-18,118 L-22,170 M18,118 L22,170" stroke="#eeeeee" stroke-width="5" stroke-linecap="round"/>
        <path d="M-18,118 L-22,170 M18,118 L22,170" stroke="#1c1c1c" stroke-width="1.5" fill="none" opacity=".35"/>
      </g>
      <!-- マスク越しの目（通常） -->
      <g id="eyes-normal">
        <ellipse cx="-28" cy="20" rx="11" ry="8" fill="#1c1c1c"/>
        <ellipse cx="28" cy="20" rx="11" ry="8" fill="#1c1c1c"/>
        <circle cx="-25" cy="17" r="3" fill="#fff"/>
        <circle cx="31" cy="17" r="3" fill="#fff"/>
      </g>
      <!-- 目（ジト目） -->
      <g id="eyes-flat">
        <ellipse cx="-28" cy="22" rx="11" ry="6" fill="#1c1c1c"/>
        <ellipse cx="28" cy="22" rx="11" ry="6" fill="#1c1c1c"/>
        <path d="M-40,17 L-16,17 M16,17 L40,17" stroke="#6fcac2" stroke-width="6"/>
      </g>
      <!-- 目（キラキラ） -->
      <g id="eyes-sparkle">
        <ellipse cx="-28" cy="20" rx="12" ry="9" fill="#1c1c1c"/>
        <ellipse cx="28" cy="20" rx="12" ry="9" fill="#1c1c1c"/>
        <path d="M-28,12 l3,6 6,2 -6,2 -3,6 -3,-6 -6,-2 6,-2z M28,12 l3,6 6,2 -6,2 -3,6 -3,-6 -6,-2 6,-2z" fill="#fff"/>
      </g>
      <!-- 目（点） -->
      <g id="eyes-dot">
        <ellipse cx="-28" cy="20" rx="10" ry="8" fill="#1c1c1c"/>
        <ellipse cx="28" cy="20" rx="10" ry="8" fill="#1c1c1c"/>
        <circle cx="-28" cy="20" r="2.5" fill="#fff"/>
        <circle cx="28" cy="20" r="2.5" fill="#fff"/>
      </g>

      <!-- 部屋の背景（モニターだらけ） -->
      <g id="room">
        <rect x="0" y="0" width="600" height="400" fill="#f4efe4"/>
        <rect x="0" y="0" width="120" height="400" fill="#ece6d8"/>
        <line x1="120" y1="0" x2="120" y2="400" stroke="#d8d0bf" stroke-width="3"/>
        <!-- モニター -->
        <g stroke="#1c1c1c" stroke-width="3">
          <rect x="150" y="30" width="140" height="84" rx="4" fill="#2a2f3a"/>
          <rect x="310" y="30" width="140" height="84" rx="4" fill="#2a2f3a"/>
          <rect x="460" y="40" width="130" height="80" rx="4" fill="#2a2f3a"/>
          <rect x="170" y="128" width="120" height="70" rx="4" fill="#2a2f3a"/>
          <rect x="450" y="132" width="130" height="72" rx="4" fill="#2a2f3a"/>
        </g>
        <!-- 机 -->
        <rect x="0" y="320" width="600" height="80" fill="#d9b98a" stroke="#1c1c1c" stroke-width="3"/>
        <line x1="0" y1="334" x2="600" y2="334" stroke="#b8976a" stroke-width="2"/>
      </g>
    </defs>
  </svg>

  <!-- ① -->
  <svg class="panel" viewBox="0 0 600 400" role="img" aria-label="1コマ目：AI仙人が転記作業にうんざりしている">
    <use href="#room"/>
    <!-- 書類の山 -->
    <g stroke="#1c1c1c" stroke-width="2.5">
      <rect x="440" y="250" width="110" height="18" fill="#fff"/>
      <rect x="446" y="232" width="104" height="18" fill="#fff"/>
      <rect x="438" y="214" width="110" height="18" fill="#fff"/>
      <rect x="448" y="196" width="100" height="18" fill="#fff"/>
      <rect x="436" y="268" width="116" height="52" fill="#fff"/>
    </g>
    <text x="494" y="300" text-anchor="middle" font-size="16">資料</text>
    <g transform="translate(270,210) rotate(-4)">
      <use href="#sennin"/>
      <use href="#eyes-flat"/>
      <path d="M-14,72 C-6,66 6,66 14,72" fill="none" stroke="#1c1c1c" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- どんより線 -->
    <g stroke="#1c1c1c" stroke-width="2" opacity=".5">
      <line x1="196" y1="130" x2="196" y2="170"/><line x1="206" y1="124" x2="206" y2="176"/><line x1="216" y1="132" x2="216" y2="168"/>
    </g>
    <!-- 吹き出し -->
    <path d="M20,20 H250 Q262,20 262,32 V112 Q262,124 250,124 H150 L130,150 L128,124 H32 Q20,124 20,112 V32 Q20,20 32,20 Z" fill="#fff" stroke="#1c1c1c" stroke-width="3"/>
    <text x="141" y="58" text-anchor="middle" font-size="20">資料を作って</text>
    <text x="141" y="86" text-anchor="middle" font-size="20">転記していくのが</text>
    <text x="141" y="112" text-anchor="middle" font-size="20">面倒くさい…</text>
    <circle cx="36" cy="372" r="18" fill="#1c1c1c"/><text x="36" y="379" text-anchor="middle" fill="#fff" font-size="18" class="pop">1</text>
  </svg>

  <!-- ② -->
  <svg class="panel" viewBox="0 0 600 400" role="img" aria-label="2コマ目：AI仙人がOpus 5.5に指示を出す">
    <use href="#room"/>
    <!-- 集中線 -->
    <g stroke="#1c1c1c" stroke-width="2" opacity=".18">
      <line x1="300" y1="200" x2="0" y2="0"/><line x1="300" y1="200" x2="600" y2="0"/>
      <line x1="300" y1="200" x2="0" y2="200"/><line x1="300" y1="200" x2="600" y2="200"/>
      <line x1="300" y1="200" x2="150" y2="0"/><line x1="300" y1="200" x2="450" y2="0"/>
      <line x1="300" y1="200" x2="0" y2="100"/><line x1="300" y1="200" x2="600" y2="100"/>
    </g>
    <!-- 画面の入力欄 -->
    <rect x="316" y="44" width="128" height="56" rx="4" fill="#fdfaf2"/>
    <text x="380" y="66" text-anchor="middle" font-size="12" fill="#c15f3c">Opus 5.5</text>
    <text x="380" y="88" text-anchor="middle" font-size="11" fill="#1c1c1c">資料まとめといて▍</text>
    <g transform="translate(200,215)">
      <use href="#sennin"/>
      <use href="#eyes-sparkle"/>
      <path d="M-20,66 Q0,92 20,66 Z" fill="#8a2f2f" stroke="#1c1c1c" stroke-width="3"/>
      <!-- 指さし -->
      <path d="M70,150 L150,90" stroke="#b8bbc0" stroke-width="30" stroke-linecap="round"/>
      <path d="M70,150 L150,90" stroke="#1c1c1c" stroke-width="3" fill="none" opacity=".0"/>
      <circle cx="156" cy="86" r="16" fill="#f2d3b8" stroke="#1c1c1c" stroke-width="3"/>
      <path d="M166,78 L196,56" stroke="#f2d3b8" stroke-width="10" stroke-linecap="round"/>
      <path d="M166,78 L196,56" stroke="#1c1c1c" stroke-width="1.5" fill="none" opacity=".5"/>
    </g>
    <!-- 吹き出し -->
    <path d="M40,20 C10,20 10,110 50,112 L70,140 L84,112 C150,120 250,118 260,70 C270,20 150,14 40,20 Z" fill="#fff" stroke="#1c1c1c" stroke-width="3"/>
    <text x="140" y="60" text-anchor="middle" font-size="22" class="pop">そこで</text>
    <text x="140" y="96" text-anchor="middle" font-size="26" class="pop" fill="#c15f3c">Opus 5.5じゃ！</text>
    <circle cx="36" cy="372" r="18" fill="#1c1c1c"/><text x="36" y="379" text-anchor="middle" fill="#fff" font-size="18" class="pop">2</text>
  </svg>

  <!-- ③ -->
  <svg class="panel" viewBox="0 0 600 400" role="img" aria-label="3コマ目：なぜか宇宙を飛ぶ牛のピクセルアニメが出てくる">
    <rect width="600" height="400" fill="#1d1a3a"/>
    <!-- 星 -->
    <g fill="#fff">
      <rect x="40" y="40" width="6" height="6"/><rect x="120" y="90" width="4" height="4"/><rect x="220" y="30" width="6" height="6"/>
      <rect x="520" y="60" width="4" height="4"/><rect x="560" y="140" width="6" height="6"/><rect x="80" y="170" width="4" height="4"/>
      <rect x="300" y="120" width="4" height="4"/><rect x="260" y="200" width="6" height="6"/><rect x="480" y="210" width="4" height="4"/>
      <rect x="30" y="250" width="6" height="6"/><rect x="560" y="260" width="4" height="4"/>
    </g>
    <!-- 惑星 -->
    <circle cx="470" cy="100" r="42" fill="#3f78d8"/>
    <rect x="428" y="84" width="84" height="10" fill="#5d9cf0"/>
    <rect x="428" y="108" width="84" height="8" fill="#2d5ab0"/>
    <ellipse cx="470" cy="104" rx="72" ry="12" fill="none" stroke="#f0c53a" stroke-width="7"/>
    <!-- 虹の道 -->
    <g>
      <rect x="0" y="286" width="600" height="8" fill="#ff4d4d"/>
      <rect x="0" y="294" width="600" height="8" fill="#ff9f3a"/>
      <rect x="0" y="302" width="600" height="8" fill="#ffe14d"/>
      <rect x="0" y="310" width="600" height="8" fill="#4dd964"/>
      <rect x="0" y="318" width="600" height="8" fill="#4da6ff"/>
      <rect x="0" y="326" width="600" height="8" fill="#9b5cff"/>
    </g>
    <!-- ピクセル牛 -->
    <g transform="translate(250,196)">
      <rect x="0" y="0" width="56" height="36" fill="#c98b5a"/>
      <rect x="8" y="10" width="8" height="8" fill="#1c1c1c"/><rect x="40" y="10" width="8" height="8" fill="#1c1c1c"/>
      <rect x="16" y="24" width="24" height="8" fill="#f2b8a0"/>
      <rect x="-8" y="0" width="8" height="8" fill="#fff"/><rect x="56" y="0" width="8" height="8" fill="#fff"/>
      <rect x="-24" y="36" width="36" height="30" fill="#e84ee0"/>
      <rect x="-32" y="44" width="10" height="16" fill="#9b5cff"/>
      <g fill="#ffe14d"><rect x="-60" y="60" width="6" height="6"/><rect x="-80" y="48" width="4" height="4"/><rect x="-50" y="80" width="4" height="4"/></g>
    </g>
    <!-- 仙人（画面手前・小さめ、後ろ姿寄り） -->
    <g transform="translate(110,330) scale(.62)">
      <use href="#sennin"/>
      <use href="#eyes-dot"/>
      <ellipse cx="0" cy="70" rx="7" ry="9" fill="#1c1c1c"/>
    </g>
    <text x="150" y="252" font-size="36" class="pop" fill="#fff">…</text>
    <!-- 吹き出し -->
    <path d="M360,250 H580 Q590,250 590,260 V330 Q590,340 580,340 H300 L180,300 L300,316 V260 Q300,250 310,250 Z" fill="#fff" stroke="#1c1c1c" stroke-width="3"/>
    <text x="445" y="284" text-anchor="middle" font-size="20">資料は…？</text>
    <text x="445" y="316" text-anchor="middle" font-size="20">なぜピクセルアニメ？</text>
    <text x="300" y="46" text-anchor="middle" font-size="18" fill="#ffe14d" class="pop">5分で完成！</text>
    <circle cx="36" cy="372" r="18" fill="#fff"/><text x="36" y="379" text-anchor="middle" fill="#1c1c1c" font-size="18" class="pop">3</text>
  </svg>

  <!-- ④ -->
  <svg class="panel" viewBox="0 0 600 400" role="img" aria-label="4コマ目：AI仙人がアニメを見ながら満足し、転記は宿題にする">
    <use href="#room"/>
    <!-- 全モニターが宇宙に -->
    <g>
      <rect x="152" y="32" width="136" height="80" fill="#1d1a3a"/>
      <rect x="312" y="32" width="136" height="80" fill="#1d1a3a"/>
      <rect x="462" y="42" width="126" height="76" fill="#1d1a3a"/>
      <rect x="172" y="130" width="116" height="66" fill="#1d1a3a"/>
      <rect x="452" y="134" width="126" height="68" fill="#1d1a3a"/>
      <g fill="#ff4d4d"><rect x="152" y="96" width="136" height="4"/><rect x="312" y="96" width="136" height="4"/><rect x="462" y="102" width="126" height="4"/><rect x="172" y="182" width="116" height="4"/><rect x="452" y="186" width="126" height="4"/></g>
      <g fill="#ffe14d"><rect x="152" y="100" width="136" height="4"/><rect x="312" y="100" width="136" height="4"/><rect x="462" y="106" width="126" height="4"/><rect x="172" y="186" width="116" height="4"/><rect x="452" y="190" width="126" height="4"/></g>
      <g fill="#4da6ff"><rect x="152" y="104" width="136" height="4"/><rect x="312" y="104" width="136" height="4"/><rect x="462" y="110" width="126" height="4"/><rect x="172" y="190" width="116" height="4"/><rect x="452" y="194" width="126" height="4"/></g>
      <g fill="#c98b5a"><rect x="210" y="66" width="16" height="12"/><rect x="370" y="60" width="16" height="12"/><rect x="516" y="72" width="16" height="12"/><rect x="222" y="152" width="16" height="12"/><rect x="506" y="156" width="16" height="12"/></g>
    </g>
    <!-- 書類の山（放置） -->
    <g stroke="#1c1c1c" stroke-width="2.5" opacity=".75">
      <rect x="470" y="268" width="110" height="52" fill="#fff"/>
      <rect x="476" y="250" width="100" height="18" fill="#fff"/>
    </g>
    <text x="525" y="300" text-anchor="middle" font-size="14" opacity=".75">資料（未）</text>
    <g transform="translate(300,220)">
      <use href="#sennin"/>
      <use href="#eyes-normal"/>
      <path d="M-22,62 Q0,84 22,62" fill="none" stroke="#1c1c1c" stroke-width="4" stroke-linecap="round"/>
      <!-- 頬 -->
      <ellipse cx="-38" cy="56" rx="8" ry="4" fill="#f09a8a" opacity=".7"/>
      <ellipse cx="38" cy="56" rx="8" ry="4" fill="#f09a8a" opacity=".7"/>
      <!-- 腕組み -->
      <path d="M-80,168 C-30,150 30,150 80,168" stroke="#a9acb2" stroke-width="30" fill="none" stroke-linecap="round"/>
      <path d="M-80,168 C-30,150 30,150 80,168" stroke="#1c1c1c" stroke-width="2" fill="none" opacity=".4"/>
    </g>
    <!-- 吹き出し -->
    <path d="M20,20 H250 Q262,20 262,32 V112 Q262,124 250,124 H200 L236,166 L170,124 H32 Q20,124 20,112 V32 Q20,20 32,20 Z" fill="#fff" stroke="#1c1c1c" stroke-width="3"/>
    <text x="141" y="58" text-anchor="middle" font-size="20">うむ、良い出来じゃ</text>
    <text x="141" y="90" text-anchor="middle" font-size="20">転記は…</text>
    <text x="141" y="114" text-anchor="middle" font-size="20" fill="#c15f3c">明日の宿題じゃ</text>
    <!-- テロップ -->
    <rect x="360" y="336" width="232" height="40" fill="#1c1c1c"/>
    <rect x="360" y="336" width="8" height="40" fill="#e0342c"/>
    <text x="478" y="363" text-anchor="middle" font-size="19" fill="#fff" class="pop">AI仙人からの宿題</text>
    <circle cx="36" cy="372" r="18" fill="#1c1c1c"/><text x="36" y="379" text-anchor="middle" fill="#fff" font-size="18" class="pop">4</text>
  </svg>

  <footer>おわり</footer>
</main>
</body>
</html>
